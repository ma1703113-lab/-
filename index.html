 <ul class="f">${p.features.map(f=>`<li>${f}</li>`).join("")}<li>اللون: ${p.color}</li></ul>
 <div class="box"><div class="price">السعر: عند الطلب (واتساب/فون)</div>
 <label>المقاس${p.sizes.length?"":" (اكتب المقاس المطلوب)"}<input class="sz" list="dl-${p.id}" placeholder="${p.sizes.length?'مثال: '+p.sizes[0]:'المقاس'}"><datalist id="dl-${p.id}">${p.sizes.map(s=>`<option value="${s}">`).join("")}</datalist></label>
 <label>الكمية<input class="qt" type="number" min="1" value="1"></label>
 <button class="o">اطلب عبر واتساب</button></div></div></div></section>`);
 const s=document.getElementById(p.id);
 s.querySelectorAll(".th img").forEach(t=>t.onclick=()=>{s.querySelector(".main").src=t.src;s.querySelectorAll(".th img").forEach(x=>x.classList.remove("on"));t.classList.add("on")});
 s.querySelector(".o").onclick=()=>{
  const m=`السلام عليكم، عايز أطلب من متجر السروال نور الدين:\n${p.name}\nاللون: ${p.color}\nالمقاس: ${s.querySelector(".sz").value||"-"}\nالكمية: ${s.querySelector(".qt").value||1}`;
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(m)}`,"_blank");
 };
});
</script></body></html>
